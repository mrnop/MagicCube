name: magic_cube
description: Flutter port of MagicCube image processing app
version: 1.0.6+6

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter 
  # Core functionality
  path_provider: ^2.1.5
  path: ^1.9.1
  shared_preferences: ^2.3.5
  
  # Image handling
  image_picker: ^1.2.0
  image: ^4.5.4
  image_cropper: ^11.0.0
  photo_view: ^0.15.0
  
  # UI Components
  flutter_staggered_grid_view: ^0.7.0
  
  # File and JSON handling
  http: ^1.2.2
  
  # State management
  provider: ^6.1.2
  
  # Animations
  lottie: ^3.3.1
  
  # Device info
  device_info_plus: ^12.1.0
  
  # Permissions
  permission_handler: ^12.0.1
  
  # PDF generation and sharing
  pdf: ^3.11.1
  share_plus: ^10.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/magic_cube_logo.png
    - assets/magics/
    - assets/magics/magiccube/
    - assets/magics/magiccube/pages/
    - assets/magics/magiccube/pages/s/
    - assets/magics/magiccube/pages/m/
    - assets/magics/magiccube/pages/l/
    - assets/magics/magiccube/pages/xl/
    - assets/magics/magicprism/
    - assets/magics/magicprism/pages/
    - assets/magics/magicprism/pages/s/
    - assets/magics/magicprism/pages/l/
    - assets/magics/mixmatch/
    - assets/magics/mixmatch/pages/
    - assets/magics/mixmatch/pages/s/
    - assets/magics/photocube/
    - assets/magics/photocube/pages/
    - assets/magics/photocube/pages/s/
    - assets/magics/photocube/pages/m/
    - assets/magics/stackingcube/
    - assets/magics/stackingcube/pages/
    - assets/magics/stackingcube/pages/std1/
    - assets/magics/stackingcube/pages/std2/
    - assets/magics/stackingcube/pages/m/
    - assets/devices.json